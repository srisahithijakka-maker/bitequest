<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BiteQuest | Find Recipes Using Your Ingredients</title>

    <link rel="stylesheet" href="css/style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
        rel="stylesheet">
</head>

<body>

    <!-- ================= NAVBAR ================= -->

    <header class="navbar">

        <div class="container navbar-container">

            <a href="index.html" class="logo">
                🍳 BiteQuest
            </a>

            <nav>

                <ul class="nav-links">

                    <li>
                        <a href="index.html">Home</a>
                    </li>

                    <li>
                        <a href="favourites.html">Favourites</a>
                    </li>

                </ul>

            </nav>

        </div>

    </header>



    <!-- ================= HERO ================= -->

    <main>

        <section class="hero">

            <div class="container hero-container">

                <!-- LEFT SIDE -->

                <div class="hero-content">

                    <h1>
                        Find recipes using ingredients
                        you already have.
                    </h1>

                    <p>
                        Enter the ingredients available in your kitchen and discover
                        recipes you can cook without unnecessary grocery trips.
                    </p>


                    <!-- Search -->

                    <form id="searchForm" class="search-form">

                        <input
                            type="text"
                            id="ingredientInput"
                            placeholder="Example: egg, onion, tomato">

                        <button type="submit">

                            Find Matching Recipes

                        </button>

                    </form>


                    <!-- Quick Search -->

                    <div class="quick-search">

                        <span>Quick Search</span>

                        <button class="quick-item" data-value="egg">
                            Egg
                        </button>

                        <button class="quick-item" data-value="rice">
                            Rice
                        </button>

                        <button class="quick-item" data-value="paneer">
                            Paneer
                        </button>

                        <button class="quick-item" data-value="milk">
                            Milk
                        </button>

                        <button class="quick-item" data-value="chicken">
                            Chicken
                        </button>

                    </div>

                </div>



                <!-- RIGHT SIDE -->

                <aside class="pantry">

                    <h2>

                        My Pantry

                    </h2>


                    <ul id="pantryList">

                        <li class="empty">

                            Your pantry is empty.

                        </li>

                    </ul>


                    <div class="pantry-buttons">

                        <button id="addIngredientBtn">

                            + Add Ingredient

                        </button>

                        <button id="searchPantryBtn">

                            Search Using Pantry

                        </button>

                    </div>

                </aside>

            </div>

        </section>

    </main>



    <!-- ================= FOOTER ================= -->

    <footer>

        <div class="container">

            <p>

                © BiteQuest • Built as a college project

            </p>

        </div>

    </footer>


    <script src="js/pantry.js"></script>
    <script src="js/main.js"></script>

</body>

</html>
