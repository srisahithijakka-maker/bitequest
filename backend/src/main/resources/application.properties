spring.application.name=bitequest-backend

# ===== Server =====
server.port=8080

# ===== Database (MySQL) =====
# Assumes the database 'bitequest' already exists in MySQL.
# Set the MYSQL_PASSWORD environment variable to your real MySQL password,
# or replace the placeholder value directly here.
# allowPublicKeyRetrieval is only needed on MySQL 8+ (caching_sha2_password) -
# remove it if your setup does not require it.
spring.datasource.url=jdbc:mysql://localhost:3306/bitequest?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=${MYSQL_PASSWORD}

# ===== JPA / Hibernate =====
# update: Hibernate creates/updates tables automatically from our entities
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true