<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>BiteQuest | My Favourites</title>

    <link rel="stylesheet"
        href="css/style.css">

    <link rel="preconnect"
        href="https://fonts.googleapis.com">

    <link rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
        rel="stylesheet">

</head>

<body>

    <!-- ================= NAVBAR ================= -->

    <header class="navbar">

        <div class="container navbar-container">

            <a href="index.html" class="logo">
                🍳 BiteQuest
            </a>

            <nav>

                <ul class="nav-links">

                    <li>
                        <a href="index.html">Home</a>
                    </li>

                    <li>
                        <a href="favourites.html">Favourites</a>
                    </li>

                    <li>
                        <a href="results.html">Results</a>
                    </li>

                </ul>

            </nav>

        </div>

    </header>



    <!-- ================= PAGE HEADER ================= -->

    <section class="results-header">

        <div class="container">

            <h1>

                My Favourites

            </h1>

            <p>

                Recipes you have saved for later.

            </p>

        </div>

    </section>



    <!-- ================= FAVOURITES ================= -->

    <main>

        <section class="results-section">

            <div class="container">

                <!-- Loading -->

                <div id="loadingMessage"
                    class="loading-message">

                    Loading favourites...

                </div>


                <!-- Empty State -->

                <div id="noFavourites"
                    class="no-results"
                    style="display:none;">

                    <h2>

                        No favourites yet

                    </h2>

                    <p>

                        Save recipes you like and they will appear here.

                    </p>

                    <a href="index.html">

                        ← Find Recipes

                    </a>

                </div>


                <!-- Favourites Grid -->

                <div id="favouritesContainer"
                    class="favourites-grid">

                    <!-- JavaScript creates recipe cards here -->

                </div>

            </div>

        </section>

    </main>



    <!-- ================= FOOTER ================= -->

    <footer>

        <div class="container">

            <p>

                ©BiteQuest • Built as a college project

            </p>

        </div>

    </footer>


    <script src="js/favourites.js"></script>

</body>

</html>
